name: ai-retouch-agent

# 基础设施不在此文件内定义：PostgreSQL / Redis / MinIO 已改成本机独立共享服务，
# 供本机与家庭内网多个项目复用（host 网络，监听 0.0.0.0）：
#
#   ~/Desktop/postgres  → localhost:5433（5432 已被其他项目占用）
#   ~/Desktop/redis     → localhost:6379（本项目占用 db 2，db 0/1 已被其他项目占用）
#   ~/Desktop/minio     → localhost:9000（控制台 9001）
#
# 启停基础设施用各自目录下的 compose，例如：
#   docker compose -f ~/Desktop/postgres/docker-compose.yml up -d
#
# 本文件只保留部署用的 app 与 worker：docker compose --profile deploy up -d

services:
  app:
    profiles: ["deploy"]
    build: .
    restart: unless-stopped
    # host 网络：与共享基础设施保持一致，且无需再做端口映射
    # （uvicorn 直接绑定宿主机 7302，.env 里的 localhost 连接串也照常可用）
    network_mode: host
    command: uvicorn app.main:app --host 0.0.0.0 --port 7302
    env_file: .env
    volumes:
      - cv_models:/root/.u2net

  worker:
    profiles: ["deploy"]
    build: .
    restart: unless-stopped
    network_mode: host
    command: arq app.worker.WorkerSettings
    env_file: .env
    volumes:
      - cv_models:/root/.u2net

volumes:
  cv_models:
